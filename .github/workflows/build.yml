# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions: read-all

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*", "ci-test/**" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      outer-sha: ${{ steps.compute-versions.outputs.outer-sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0
        ref: ${{ github.ref }}
    - name: Git setup
      run: |
        git config --global commit.gpgsign false
        git config --global user.email olauncher@example.com
        git config --global user.name olauncher
        git config --global core.autocrlf input
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Set up OLauncher
      run: |
        chmod +x ./*.sh || true
        bash decompile.sh
        bash init.sh
        bash applyPatches.sh
    - name: Compute versions
      id: compute-versions
      run: |
        echo "OUTER_DESCR=$(git describe --tags --dirty --always --match 'v*' || echo unknown)" >> $GITHUB_ENV
        OUTER_SHA_VAL=$(git rev-parse --short=7 HEAD)
        echo "OUTER_SHA=$OUTER_SHA_VAL" >> $GITHUB_ENV
        echo "outer-sha=$(date -u +%Y%m%d)-$OUTER_SHA_VAL" >> $GITHUB_OUTPUT
        if [ -z "$(git status --porcelain)" ]; then echo "OUTER_DIRTY=clean" >> $GITHUB_ENV; else echo "OUTER_DIRTY=dirty" >> $GITHUB_ENV; fi
        pushd olauncher >/dev/null
        echo "INNER_DESCR=$(git describe --tags --dirty --always || echo unknown)" >> $GITHUB_ENV
        echo "INNER_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
        if [ -z "$(git status --porcelain)" ]; then echo "INNER_DIRTY=clean" >> $GITHUB_ENV; else echo "INNER_DIRTY=dirty" >> $GITHUB_ENV; fi
        popd >/dev/null
    - name: Build launcher with Maven
      working-directory: olauncher
      run: |
        mvn --batch-mode --update-snapshots verify \
          -Douter.describe="${{ env.OUTER_DESCR }}" \
          -Dinner.describe="${{ env.INNER_DESCR }}" \
          -Douter.sha="${{ env.OUTER_SHA }}" \
          -Dinner.sha="${{ env.INNER_SHA }}" \
          -Douter.dirty="${{ env.OUTER_DIRTY }}" \
          -Dinner.dirty="${{ env.INNER_DIRTY }}"
    - name: Build bootstrap with Maven
      working-directory: bootstrap-olauncher
      run: |
        mvn --batch-mode --update-snapshots verify
    - name: Generate redistributable
      run: bash genredist.sh
    - name: Rename dev build artifact
      if: github.ref == 'refs/heads/dev'
      run: |
        mv olauncher-*-redist.jar olauncher-${{ env.OUTER_SHA }}-redist.jar    
    - name: Upload redistributable
      uses: actions/upload-artifact@v7
      id: upload-artifact
      with:
        name: OLauncher Components
        path: |
          olauncher-*-redist.jar
          launcher.bsdiff
  draft-master-release:
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download redistributable jar
        uses: actions/download-artifact@v7
        id: download-artifact
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: redist
      - name: Create release draft with redistributable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_PATH: ${{ steps.download-artifact.outputs.download-path }}
        run: |
          REDIST_SHA256=$(sha256sum "$ARTIFACT_PATH"/*.jar | awk '{print $1}')
          PATCH_SHA256=$(sha256sum "$ARTIFACT_PATH"/*.bsdiff | awk '{print $1}')
          NOTES="redist-sha256: $REDIST_SHA256"
          NOTES=$(printf 'patch-sha256: %s\nredist-sha256: %s' "$PATCH_SHA256" "$REDIST_SHA256")
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" \
            --notes "$NOTES" \
            "$ARTIFACT_PATH"/*.*

  dev-release:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download files
        uses: actions/download-artifact@v7
        id: download-artifact
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: redist
      - name: Create dev pre-release
        env:
          DEV_TAG: dev-${{ needs.build.outputs.outer-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_PATH: ${{ steps.download-artifact.outputs.download-path }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REDIST_SHA256=$(sha256sum "$ARTIFACT_PATH"/*.jar | awk '{print $1}')
          PATCH_SHA256=$(sha256sum "$ARTIFACT_PATH"/*.bsdiff | awk '{print $1}')
          NOTES=$(printf 'build-sha: %s\npatch-sha256: %s\nredist-sha256: %s' "$COMMIT_SHA" "$PATCH_SHA256" "$REDIST_SHA256")
          gh release create "$DEV_TAG" \
            --draft \
            --prerelease \
            --title "$DEV_TAG" \
            --notes "$NOTES" \
            --target "$COMMIT_SHA" \
            "$ARTIFACT_PATH"/*.*
